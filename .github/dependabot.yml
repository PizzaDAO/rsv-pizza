version: 2
# Automated dependency updates. The repo had 62 open alerts (33 high) with no
# automation; this generates testable, grouped update PRs so bumps go through CI
# (build + typecheck + schema/rls/migration guards) instead of piling up.
# Majors with no advisory/EOL are ignored to cut noise (2026-10-15). wagmi majors are
# deliberately NOT ignored: they carry real advisories and should keep resurfacing.
# npm: ONE entry at "/" for the whole npm-workspaces repo (frontend + backend + root).
# There is a single lockfile (root package-lock.json); the workspace dirs have none, so
# per-directory entries ("/frontend", "/backend") would have no lockfile to update.
# Dependabot's npm updater resolves workspace packages from the root manifest/lockfile.
# Ignore rules from the former per-directory entries are merged below.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # prisma and @prisma/client must move together (first group listed wins).
      prisma:
        patterns: ['prisma', '@prisma/*']
      # Group low-risk dev/build-chain bumps into one PR to reduce noise.
      dev-and-build:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stripe/stripe-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stripe/react-stripe-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vercel/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-helmet-async"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/supertest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@napi-rs/canvas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
      # Deferred majors with no security advisory (2026-11-14).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Prisma 7 is planned separately (prosciutto-60417); the advisory that prompted it
      # (deepmerge-ts, build-time only) is fixed by an override in package.json.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
