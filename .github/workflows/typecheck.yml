name: Typecheck

# Runs `tsc --noEmit` for frontend + backend on PRs. BLOCKING for both: both are at 0
# errors, and `vite build` doesn't type-check, so without this a type break (or an
# unused local/param under noUnusedLocals/noUnusedParameters) can ship and
# black-screen at runtime. Keep them at 0.
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'backend/src/**'
      - 'frontend/tsconfig*.json'
      - 'backend/tsconfig*.json'
      # Dependency bumps (e.g. Dependabot PRs) must run CI too.
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'backend/package.json'
      - '.github/workflows/typecheck.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # BLOCKING: frontend is at 0 tsc errors — keep it there.
      - name: tsc --noEmit (frontend)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # backend has no lockfile of its own — it's an npm workspace resolved by
          # the ROOT package-lock.json, so install from the root.
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      # BLOCKING: backend is at 0 tsc errors — keep it there.
      - name: tsc --noEmit (backend)
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json
