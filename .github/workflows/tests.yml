name: Tests

# Runs the vitest suites (backend + frontend) on PRs. Both are BLOCKING: the
# frontend suite is fully green, so a failing frontend test now blocks merges.
# This is the structural fix — adding more tests (RLS/anon-exposure, payout
# money-path) builds on top of it.
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'backend/src/**'
      - 'frontend/**/*.test.ts'
      - 'frontend/**/*.test.tsx'
      - 'backend/**/*.test.ts'
      # Dependency bumps (e.g. Dependabot PRs) must run CI too.
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'backend/package.json'
      - '.github/workflows/tests.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          # backend has no lockfile of its own — it's an npm workspace resolved by
          # the ROOT package-lock.json, so install from the root.
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      # BLOCKING: backend suite is fully green (416/416).
      - name: Test (backend)
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # BLOCKING: frontend suite is fully green.
      - name: Test (frontend)
        working-directory: frontend
        run: npm test
